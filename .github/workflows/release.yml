name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WIT version for publish tasks"
        required: true
      publish_wit:
        description: "Publish WIT package"
        type: boolean
        default: true
      publish_sdk:
        description: "Publish surrealdb-component-sdk"
        type: boolean
        default: true
      publish_host_adapter:
        description: "Publish surrealdb-host-adapter"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  test-examples:
    runs-on: ubuntu-latest
    if: inputs.publish_wit || inputs.publish_sdk || inputs.publish_host_adapter
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - name: Run example tests
        run: devenv shell -- test-examples

  publish-wit:
    runs-on: ubuntu-latest
    needs: test-examples
    if: inputs.publish_wit
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devenv shell -- ghcr-login
      - name: Publish package
        run: devenv shell -- release-publish "$VERSION"

  publish-crates:
    runs-on: ubuntu-latest
    needs:
      - test-examples
      - publish-wit
    if: >-
      always() &&
      needs.test-examples.result == 'success' &&
      (inputs.publish_sdk || inputs.publish_host_adapter) &&
      (needs.publish-wit.result == 'success' || needs.publish-wit.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - name: Validate crates publish token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN repository secret"
            exit 1
          fi
      - name: Dry run publish surrealdb-component-sdk
        if: inputs.publish_sdk
        run: devenv shell -- cargo publish --dry-run -p surrealdb-component-sdk
      - name: Dry run publish surrealdb-host-adapter
        if: inputs.publish_host_adapter
        run: devenv shell -- cargo publish --dry-run -p surrealdb-host-adapter
      - name: Publish surrealdb-component-sdk
        if: inputs.publish_sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: devenv shell -- cargo publish -p surrealdb-component-sdk
      - name: Publish surrealdb-host-adapter
        if: inputs.publish_host_adapter
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: devenv shell -- cargo publish -p surrealdb-host-adapter
