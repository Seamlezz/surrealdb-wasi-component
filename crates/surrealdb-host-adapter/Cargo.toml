[package]
name = "surrealdb-host-adapter"
version = "0.9.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust host adapter for SurrealDB WASI components"
authors = ["Seamlezz"]
documentation = "https://github.com/Seamlezz/surrealdb-wasi-component"
keywords = ["surrealdb", "wasi", "component"]
categories = ["api-bindings"]

[features]
default = []
debug-logs = []

[dependencies]
anyhow.workspace = true
opentelemetry.workspace = true
serde.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
surrealdb.workspace = true
surrealdb-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
